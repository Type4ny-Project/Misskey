# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Misskey"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"
mise install node pnpm ffmpeg
mise exec -- pnpm install --frozen-lockfile
mise exec -- node scripts/setup-codex-environment.mjs
mise exec -- pnpm build-pre
mise exec -- pnpm --filter backend build
mise exec -- pnpm migrate'''

[[actions]]
name = "Prepare LAN HTTPS"
icon = "tool"
command = '''
. ./.config/codex-portless.env
if [ "$(uname -s)" = "Linux" ] && ! command -v avahi-publish-address >/dev/null 2>&1; then
	if command -v apt-get >/dev/null 2>&1; then
		sudo apt-get update
		sudo apt-get install -y avahi-utils
	else
		echo "Portless LAN mode requires an mDNS publisher (for example, avahi-utils)." >&2
		exit 1
	fi
fi
mise exec -- pnpm exec portless trust'''

[[actions]]
name = "Run"
icon = "run"
command = "mise exec -- pnpm dev:portless"
